# Read the Docs build. Versions are activated in the project's dashboard; this
# file is what every one of them is built with.
#
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    # The CPU kernels are compiled from source here, as they are anywhere a
    # wheel does not exist; ``cmake`` and ``ninja`` arrive as build-time
    # wheels through scikit-build-core.
    - build-essential
  jobs:
    post_checkout:
      # setuptools-scm reads the version from the tags, and Read the Docs
      # clones shallow.
      - git fetch --unshallow || true
      - git fetch --tags || true
    pre_install:
      # The default index serves the CUDA build on Linux, which is gigabytes
      # of driver libraries a builder with no card cannot use, so PyTorch
      # comes from its own CPU index and is what the project's requirement
      # resolves against: ``2.x+cpu`` sorts above the plain ``2.x`` of the
      # same release. PyPI is named alongside it because that index carries
      # wheels and nothing to build one from, so a package it serves as a
      # source distribution has to find its build backend somewhere.
      - python -m pip install --upgrade pip
      - >-
        python -m pip install torch
        --index-url https://download.pytorch.org/whl/cpu
        --extra-index-url https://pypi.org/simple
    pre_build:
      # The gallery is executed by the Docs workflow, on a runner with the
      # room for the phantoms, the segmentation network and the encoding, and
      # what it produced is pushed to the ``docs-gallery`` branch. Restored
      # here, every page arrives with the figures and the printed output it
      # was built with, and this build runs Sphinx alone. A page whose source
      # moved on since is named in the log.
      - git fetch --depth 1 origin docs-gallery || true
      - git checkout FETCH_HEAD -- docs/generated || true

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

formats:
  - htmlzip

python:
  install:
    # What the pages themselves need. The phantom, segmentation, coil and
    # encoding packages the later examples import are the ``examples`` extra,
    # which the Docs workflow installs to execute them; here their output is
    # restored rather than produced.
    - method: pip
      path: .
      extra_requirements:
        - doc
