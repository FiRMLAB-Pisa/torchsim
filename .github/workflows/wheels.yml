name: Wheels

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # A change to how the package is built is checked where it is built, not
  # after a release has already gone out.
  pull_request:
    paths:
      - pyproject.toml
      - CMakeLists.txt
      - setup.py
      - "src/torchsim/*.cpp"
      - "src/torchsim/*.hpp"
      - scripts/check_wheel.py
      - .github/workflows/wheels.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist

      - name: Check the metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, label: manylinux + musllinux x86_64}
          - {os: ubuntu-24.04-arm, label: manylinux + musllinux aarch64}
          - {os: macos-latest, label: macOS arm64 and x86_64}
          - {os: windows-latest, label: Windows AMD64}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Which interpreters, which architectures and what each wheel is tested
      # with are all in [tool.cibuildwheel] in pyproject.toml, so a local
      # `cibuildwheel` run and this one agree.
      - uses: pypa/cibuildwheel@v4.2.1

      # cibuildwheel installs a wheel with its dependencies before it tests
      # it, and PyTorch publishes no musllinux wheel for that to resolve. The
      # kernels need none of it, so they are loaded here with the dependencies
      # left out -- on a later interpreter than the one they were built
      # against, which is the stable ABI they claim.
      - name: Load the musl kernels
        if: runner.os == 'Linux'
        run: |
          docker run --rm --volume "$PWD:/io" --workdir /io python:3.12-alpine \
            sh -c 'pip install --no-deps wheelhouse/*musllinux*.whl && python scripts/check_wheel.py'

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: [sdist, wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/torchsim
    permissions:
      # Trusted publishing: no API token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
