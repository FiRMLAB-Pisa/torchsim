name: Docs

# Every branch, so a check cannot first fail on the pull request.
on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pages:
    name: Pages
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm reads the version out of the tags.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          # What .readthedocs.yaml builds the published pages with.
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # The default index serves the CUDA build on Linux, which is gigabytes
      # of driver libraries a runner with no card cannot use.
      - name: Install PyTorch (CPU)
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      # The ``doc`` extra alone, which is what the hosted builder installs:
      # every page is written, and the examples needing nothing but TorchSim
      # are executed. What the rest need is the Gallery job below.
      - name: Build the extensions and install
        run: python -m pip install ".[doc]"

      - name: Build the HTML
        run: bash scripts/build_docs.sh

      - uses: actions/upload-artifact@v4
        with:
          name: html
          path: docs/build/html
          retention-days: 7

  gallery:
    name: Gallery
    # What the published pages show. The examples are executed here, where
    # the phantoms, the segmentation network and the encoding fit and where
    # there is time to download a subject, and what they produced is pushed
    # to the branch ``.readthedocs.yaml`` restores before it runs Sphinx.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
          && (github.ref == 'refs/heads/main'
              || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # torchvision reaches this job through deepinv, which imports it as it
      # loads, and its compiled half registers its operators against the exact
      # PyTorch it was built for. Both come from the CPU index in one command
      # so that the pair matches.
      - name: Install PyTorch and torchvision (CPU)
        run: |
          python -m pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu

      # Everything else the notebooks import while they run, which is the
      # ``examples`` extra, so that every one of the thirteen is executed.
      - name: Build the extensions and install
        run: python -m pip install ".[doc,examples]"

      - name: Build the HTML
        run: bash scripts/build_docs.sh

      - name: Report what was executed
        run: |
          find docs/generated/autoexamples -name '*.py.md5' -printf '%f\n' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: html-gallery
          path: docs/build/html
          retention-days: 7

      # One commit holding the executed gallery, replaced each time: the
      # branch is what a documentation build restores, not a history.
      - name: Publish the executed gallery
        # A run started by hand on a branch builds and uploads; what the
        # published pages restore is written by ``main`` and by a tag.
        if: >-
          github.ref == 'refs/heads/main'
          || startsWith(github.ref, 'refs/tags/v')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan docs-gallery
          git rm -r --cached . --quiet
          # sphinx-gallery caches the indexes it resolves links against in a
          # shelve, which is written in whichever dbm format this runner's
          # interpreter has and is unreadable to one built without it.
          find docs/generated -name 'searchindex*' -delete
          git add --force docs/generated
          git commit --quiet -m "Gallery executed from ${{ github.sha }}"
          git push --force origin docs-gallery
