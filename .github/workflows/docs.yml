name: Docs

# Every branch, so a check cannot first fail on the pull request.
on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  html:
    name: HTML
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm reads the version out of the tags.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # The default index serves the CUDA build on Linux, which is gigabytes
      # of driver libraries a runner with no card cannot use. PyPI is named
      # alongside it so that a package the CPU index has no wheel for is
      # still resolvable.
      - name: Install PyTorch (CPU)
        run: |
          python -m pip install torch \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple

      # The ``doc`` extra alone: every page is written and the examples
      # needing nothing but TorchSim are executed, which is what a branch
      # wants to know within a few minutes. The Site job below runs the rest.
      - name: Build the extensions and install
        run: python -m pip install ".[doc]"

      - name: Build the HTML
        run: bash scripts/build_docs.sh

      - uses: actions/upload-artifact@v4
        with:
          name: html
          path: docs/build/html
          retention-days: 7

  site:
    name: Site
    # What is published. The examples are executed here, where the phantoms,
    # the segmentation network and the encoding fit and where there is time
    # to download a subject, and the pages are pushed to the branch GitHub
    # Pages serves: ``latest`` for this branch, its own directory per tag.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
          && (github.ref == 'refs/heads/main'
              || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write

    # Deploys queue rather than race for the branch they all push to.
    concurrency:
      group: publish-docs
      cancel-in-progress: false

    env:
      # A tag is published under its own name; anything else is the
      # development version. It names the directory of the site, the entry
      # the switcher marks, and the prefix the notebook links reach through.
      TORCHSIM_DOCS_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # torchvision reaches this job through deepinv, which imports it as it
      # loads, and its compiled half registers its operators against the exact
      # PyTorch it was built for. Both come from the CPU index in one command
      # so that the pair matches.
      - name: Install PyTorch and torchvision (CPU)
        run: |
          python -m pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple

      # Everything else the notebooks import while they run, which is the
      # ``examples`` extra, so that every one of the thirteen is executed.
      - name: Build the extensions and install
        run: python -m pip install ".[doc,examples]"

      - name: Build the HTML
        run: bash scripts/build_docs.sh

      - name: Report what was executed
        run: |
          find docs/generated/autoexamples -name '*.py.md5' -printf '%f\n' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: html-${{ env.TORCHSIM_DOCS_VERSION }}
          path: docs/build/html
          retention-days: 7

      - name: Publish to the site branch
        if: >-
          github.ref == 'refs/heads/main'
          || startsWith(github.ref, 'refs/tags/v')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin gh-pages; then
            git worktree add ../pages FETCH_HEAD
          else
            git worktree add --orphan ../pages
          fi
          python scripts/publish_docs.py docs/build/html "$TORCHSIM_DOCS_VERSION" ../pages
          git -C ../pages add --all
          git -C ../pages commit --quiet \
            -m "Publish $TORCHSIM_DOCS_VERSION from ${{ github.sha }}" || exit 0
          git -C ../pages push origin HEAD:gh-pages
